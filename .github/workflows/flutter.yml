name: flutter

on:
  push:
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Fails on errors; style hints and warnings are reported without failing.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
